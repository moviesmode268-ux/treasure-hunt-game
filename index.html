<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World Shooter</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div id="controls">

<button 
ontouchstart="moveForward=true" 
ontouchend="moveForward=false">
Forward
</button>

<br><br>

<button 
ontouchstart="moveLeft=true" 
ontouchend="moveLeft=false">
Left
</button>

<button 
ontouchstart="moveBackward=true" 
ontouchend="moveBackward=false">
Backward
</button>

<button 
ontouchstart="moveRight=true" 
ontouchend="moveRight=false">
Right
</button>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.1/build/three.module.js"
  }
}
</script>

<script type="module" src="game.js"></script>

</body>
</html>
