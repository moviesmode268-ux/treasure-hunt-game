<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt Game</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

h1{
    color:gold;
    margin-top:20px;
}

#grid{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:15px;
    justify-content:center;
    margin-top:30px;
}

.box{
    width:100px;
    height:100px;
    background:#444;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    cursor:pointer;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    background:gold;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#status{
    margin-top:20px;
    font-size:20px;
}
</style>

</head>
<body>

<h1>🏆 Treasure Hunt Game</h1>

<p>Find the hidden treasure before your chances run out!</p>

<button onclick="startGame()">Start Game</button>

<div id="status"></div>

<div id="grid"></div>

<script>

let treasure;
let chances;
let gameRunning=false;

function startGame(){

document.getElementById("grid").innerHTML="";

treasure=Math.floor(Math.random()*9);

chances=5;

gameRunning=true;

document.getElementById("status").innerHTML=
"Chances Left: "+chances;

for(let i=0;i<9;i++){

let box=document.createElement("div");

box.className="box";

box.innerHTML="❓";

box.onclick=function(){

if(!gameRunning)return;

if(box.innerHTML!="❓")return;

if(i===treasure){

box.innerHTML="💰";

document.getElementById("status").innerHTML=
"🎉 You Found The Treasure!";

gameRunning=false;

}else{

box.innerHTML="❌";

chances--;

if(chances==0){

gameRunning=false;

document.getElementById("status").innerHTML=
"😢 Game Over! Treasure was Box "+(treasure+1);

document.querySelectorAll(".box")[treasure].innerHTML="💰";

}else{

document.getElementById("status").innerHTML=
"Wrong! Chances Left: "+chances;

}

}

};

document.getElementById("grid").appendChild(box);

}

}

</script>

</body>
</html>
